# https://contributors.home-assistant.io/apps/reference/configuration/
name: SpeedKetchup
version: "0.5.0"
slug: speedketchup
description: Periodic internet speed tests with charts, a full history and MQTT sensors
url: https://github.com/gatispei/speedketchup-homeassistant/tree/main/speedketchup
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8288
panel_icon: mdi:speedometer
panel_title: SpeedKetchup
ports:
  8288/tcp: null
services:
  - mqtt:want
options:
  interval: 10
  download_duration: 10
  upload_duration: 10
  download_connections: 8
  upload_connections: 8
  mqtt_auto: true
schema:
  interval: int(1,10080)
  server: str?
  download_duration: int(0,300)
  upload_duration: int(0,300)
  download_connections: int(1,64)
  upload_connections: int(1,64)
  influx_url: url?
  influx_token: password?
  mqtt_auto: bool
  mqtt_host: str?
  mqtt_user: str?
  mqtt_password: password?
